# SafePay — pay.safecheckrdc.com
# SPA : /var/www/safepay/dist
# API Laravel : /api et /up → backend/public/index.php
#
# Installation :
#   cp deploy/nginx.conf /etc/nginx/sites-available/pay.safecheckrdc.com
#   ln -sf /etc/nginx/sites-available/pay.safecheckrdc.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d pay.safecheckrdc.com

server {
    listen 80;
    listen [::]:80;
    server_name pay.safecheckrdc.com;

    root /var/www/safepay/dist;
    index index.html;
    client_max_body_size 16M;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }

    location = /up {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-safecheck.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/safepay/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/safepay/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
    }

    location ^~ /api {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm-safecheck.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/safepay/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/safepay/backend/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $https if_not_empty;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        return 404;
    }
}
